<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Defence in depth, should HTML ever slip through the Markdown
         renderer: scripts only from this server's own files, no inline
         ones; no requests, images or fonts from anywhere else; no plugins,
         no <base>, no forms sent anywhere. Styles may be inline, as Svelte
         and Vite's dev server put them. The server also sends
         frame-ancestors, which a meta tag can't. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>CAF debugger</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
