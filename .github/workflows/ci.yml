# Checks every push and pull request: formatting, clippy (including
# caf-core's no-I/O rule), the docs, the tests, and the TypeScript caf-sdk
# against the types generated from caf-core's, with its own tests, and
# the debugger app.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_VERSION: "1.96.0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The fake adapter is built first, so other crates' tests find it
      # rather than each building it.
      - run: cargo build -p caf-fake-agent --locked
      - run: cargo test --workspace --locked
      # A change that doesn't fit its chat's record fails a debug
      # assertion, so only a release build reaches the code that drops and
      # reports it.
      - run: cargo test -p caf-core --release --locked a_change_that_doesnt_fit
      # The apply fixtures, regenerated from nothing, are what's checked
      # in: none stale, missing, or written by no test any more. The v1
      # sample is never written here (that's CAF_BLESS_SAMPLE).
      - name: Regenerate the apply fixtures
        run: |
          rm -rf fixtures/apply
          CAF_BLESS=1 cargo test -p caf-core --locked
          git status --porcelain -- fixtures samples
          test -z "$(git status --porcelain -- fixtures samples)"
      # The TypeScript types and samples in ts/sdk are current, the types
      # are in the one shape, and every type is exported and sampled.
      - run: cargo test -p caf-core --features ts --locked typescript_types
      # The debugger app's inspector types are current.
      - run: cargo test -p caf-debugger --features ts --locked inspector_types

  ts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: ts/sdk
      # apply, ChatCopy and Connection, and the conformance fixtures in
      # fixtures/apply.
      - run: npx vitest run
        working-directory: ts/sdk
      # The debugger app: its types, the chat view's tests, the build, and
      # the check that src/chat/ imports nothing of the app's.
      - run: npm run check
        working-directory: ts/debugger
      - run: npm run check:imports
        working-directory: ts/debugger
      - run: npx vitest run
        working-directory: ts/debugger
      - run: npm run build
        working-directory: ts/debugger

  # The debugger app end to end, in headless Chromium, against caf-debugger:
  # replaying the live 0.98.0 recording, and live with the fake agent.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p caf-debugger -p caf-fake-agent --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: npm ci
        working-directory: ts
      - run: npx playwright install --with-deps chromium
        working-directory: ts/debugger
      - run: npm run build
        working-directory: ts/debugger
      - run: npm run e2e
        working-directory: ts/debugger
        env:
          CAF_DEBUGGER: ${{ github.workspace }}/target/debug/caf-debugger
          CAF_FAKE_AGENT_BIN: ${{ github.workspace }}/target/debug/caf-fake-agent
      # Playwright keeps a failed test's trace: keep it past the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: ts/debugger/test-results/
          retention-days: 14
