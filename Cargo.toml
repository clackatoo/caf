[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/clackatoo/caf"

[workspace.dependencies]
caf-core = { path = "crates/core" }
caf-save = { path = "crates/save" }
caf-usage = { path = "crates/usage" }
# ACP's types only: CAF frames and routes the messages itself. The same
# pin as clackatoo, with the session notices clackatoo already declares.
agent-client-protocol-schema = { version = "1.10", default-features = false, features = ["unstable_end_turn_token_usage", "unstable_session_notices"] }
# pidfd_send_signal with a flag rustix has no way to pass: signalling an
# adapter's whole process group through its pidfd.
libc = "0.2"
# Where the tokio kit sends the core's reports.
log = "0.4"
# Finds line ends in an adapter's output. serde_json already builds it.
memchr = "2.8"
# Time zones, for usage summaries by the user's own days: the system's
# IANA database, with a bundled copy where it has none.
jiff = { version = "0.2", features = ["tzdb-bundle-platform"] }
# MessagePack, in named mode: the saved and Rust viewer format, which the
# shape tests round-trip through.
rmp-serde = "1.3"
# pidfds and waitid, for watching, reaping and signalling adapters; flock,
# for the setup driver's locks on installs.
rustix = { version = "1.1", features = ["fs", "process"] }
# The setup driver's download check, and the core's relay tokens, with
# hmac: HMAC-SHA256 of each chat's id, under a key drawn each run.
hmac = "0.12"
sha2 = "0.10"
# Line diffs of a file before and after a change, as hunks.
similar = { version = "2.7", default-features = false, features = ["text"] }
serde = { version = "1.0", features = ["derive"] }
# raw_value: a message's params stay unparsed until the core knows what
# they are, so one big tool output is read once.
serde_json = { version = "1.0", features = ["raw_value"] }
# TypeScript types for caf-core's, behind its feature `ts`. serde-json-impl:
# raw JSON is `JsonValue`. no-serde-warnings: the one serde attribute it
# warns of, `deserialize_with` on `AgentEvent::Stderr`, only reads, and its
# type is given by hand. Silencing them would hide a future one that
# changes a shape, so caf-core's `ts.rs` checks the types against real JSON.
ts-rs = { version = "12.0", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
# Unpacking a downloaded `.tar.gz`, in pure Rust: flate2's default backend
# is miniz_oxide. No xattr: an install needs none.
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
# The setup driver's HTTPS client: blocking, small, rustls with Mozilla's
# roots, and no async runtime of its own. No gzip: downloads are taken as
# they come, and checked byte for byte.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Unpacking a downloaded zip: deflate only, through flate2.
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
# Chat ids: UUIDs, version 7, built by the core from its seed and the
# time it's given. No `v7` or `rng`: the core makes no randomness of its
# own, so `Uuid::now_v7` doesn't even compile in it.
uuid = { version = "1.29", default-features = false, features = ["std"] }
# Saved chats are compressed with zstd: its format is frozen (RFC 8878),
# so a chat saved today reads forever. The C library, not pure Rust as
# elsewhere here: ruzstd, the pure-Rust one, compresses only at its
# fastest levels, and old chats are squeezed at the strongest, with a long
# window.
zstd = { version = "0.14", default-features = false }
tokio = { version = "1.54", features = ["rt", "macros", "io-util", "process", "sync", "time"] }
