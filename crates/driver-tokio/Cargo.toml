[package]
name = "caf-driver-tokio"
description = "CAF's drivers for tokio: agent processes, timers and the wiring around caf-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caf-core.workspace = true
# The relay's variables and check.
caf-relay.workspace = true
caf-save.workspace = true
# CAF's own tools' rules, which the runner carries out.
caf-tools.workspace = true
caf-usage.workspace = true
flate2.workspace = true
libc.workspace = true
memchr.workspace = true
log.workspace = true
rustix.workspace = true
# The JSON schemas of the app's own tools' inputs.
schemars.workspace = true
# Recording a run as JSON lines.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
ureq.workspace = true
zip.workspace = true
# net: AsyncFd for pidfds, and pipes for adapters' standard streams.
# rt-multi-thread: the threads the app's own tools run on.
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

[dev-dependencies]
# Chat ids of the tests' own.
uuid.workspace = true
# fake: Builtin::Fake, the profile the fake agent runs with.
caf-core = { workspace = true, features = ["fake"] }
caf-fake-agent = { path = "../fake-agent" }
serde_json.workspace = true
# rt-multi-thread: races between a process's task and the driver.
# test-util: timer tests on tokio's paused clock.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }
