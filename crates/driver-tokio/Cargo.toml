[package]
name = "caf-driver-tokio"
description = "CAF's drivers for tokio: agent processes, timers and the wiring around caf-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caf-core.workspace = true
libc.workspace = true
rustix.workspace = true
# net: AsyncFd for pidfds, and pipes for adapters' standard streams.
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
# rt-multi-thread: races between a process's task and the driver.
# test-util: timer tests on tokio's paused clock.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }
