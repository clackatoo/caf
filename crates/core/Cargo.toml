[package]
name = "caf-core"
description = "CAF's core: the state and rules of agent chats, with no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Claude's patch's edits are Apache-2.0, derived from its adapter: see
# src/profiles/claude-0.98.0/patch/NOTICE.
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true

[dependencies]
agent-client-protocol-schema.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
ts-rs = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
rmp-serde.workspace = true

[features]
# Core::inspect: the core's whole state as JSON, for debugging tools only.
inspect = []
# Builtin::Fake: a profile for caf-fake-agent, whose install always fails,
# offline, and whose sign-in is its `auth` commands. For tools that try
# installs and sign-ins with no real agent, and their tests.
fake = []
# TypeScript types for every type CAF serialises, through ts-rs: what the
# TypeScript caf-sdk's are generated from (`ts/sdk/src/types/`).
ts = ["dep:ts-rs"]
