[package]
name = "caf-usage"
description = "CAF's usage ledger, which every CAF app on a machine shares, its summaries, and the prices cost is estimated with. No async runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caf-core.workspace = true
# Days in the user's own time zone: IANA zones from the system's database,
# with a bundled copy where there's none (Windows).
jiff.workspace = true
# flock: one line added at a time, across copies of an app.
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
# Months that have ended are kept compressed.
zstd.workspace = true

[dev-dependencies]
