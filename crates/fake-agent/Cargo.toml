[package]
name = "caf-fake-agent"
description = "A scriptable fake ACP adapter, for CAF's tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[[bin]]
name = "caf-fake-agent"
path = "src/main.rs"
# The library has the docs; the program is a thin wrapper around it.
doc = false

[dependencies]
# Signals, dup2 and non-blocking stderr, for misbehaving on purpose.
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
