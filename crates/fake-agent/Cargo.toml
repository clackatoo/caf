[package]
name = "caf-fake-agent"
description = "A scriptable fake ACP adapter, for CAF's tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[[bin]]
name = "caf-fake-agent"
path = "src/main.rs"
# The library has the docs; the program is a thin wrapper around it.
doc = false

[dependencies]
# Its main is a relay when started as one, so tests can serve CAF's tools
# through it, as an app does through its own program.
caf-relay.workspace = true
# Signals and dup2, for misbehaving on purpose.
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
